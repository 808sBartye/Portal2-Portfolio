<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aperture Science Interactive Portfolio</title>
    <link rel="stylesheet" href="css/viewport.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-loading">
    <div id="aperture-viewport">
    <div class="page-transition-overlay"></div>
    <div id="app">
        <section id="view-menu" class="view active" style="opacity: 1;">
            <div id="debug-info" style="position: fixed; top: 10px; left: 10px; color: lime; font-family: monospace; z-index: 1000; background: rgba(0,0,0,0.8); padding: 10px;">Loading...</div>
            <video autoplay loop muted playsinline class="bg-video" poster="assets/education_background.png" id="bg-video">
                <source src="assets/video/menu_background.mp4" type="video/mp4">
            </video>

            
            <nav class="main-menu">
                <ul class="menu-list">
                    <li class="menu-item">
                        <a href="education.html" class="menu-link">
                            <span class="menu-indicator"></span>
                            <span class="menu-label">Wykształcenie</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="projects.html" class="menu-link">
                            <span class="menu-indicator"></span>
                            <span class="menu-label">Projekty</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="social.html" class="menu-link">
                            <span class="menu-indicator"></span>
                            <span class="menu-label">Social Media</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </section>
        
    </div><!-- /#app -->
    </div><!-- /#aperture-viewport -->
    
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Simple menu hover effects only
        document.addEventListener('DOMContentLoaded', () => {
            const menuLinks = document.querySelectorAll('.menu-link');
            
            menuLinks.forEach(link => {
                const indicator = link.querySelector('.menu-indicator');
                const label = link.querySelector('.menu-label');
                
                link.addEventListener('mouseenter', () => {
                    gsap.to(indicator, {
                        opacity: 1,
                        x: 0,
                        duration: 0.15,
                        ease: "power2.out"
                    });
                    
                    gsap.to(label, {
                        color: '#ffffff',
                        duration: 0.15,
                        ease: "power2.out"
                    });
                });
                
                link.addEventListener('mouseleave', () => {
                    gsap.to(indicator, {
                        opacity: 0,
                        x: -10,
                        duration: 0.15,
                        ease: "power2.in"
                    });
                    
                    gsap.to(label, {
                        color: '#a0a0a0',
                        duration: 0.15,
                        ease: "power2.in"
                    });
                });
            });
            
            lucide.createIcons();
            
            const debug = document.getElementById('debug-info');
            const video = document.getElementById('bg-video');
            if (video && debug) {
                video.addEventListener('loadeddata', () => {
                    debug.innerHTML += 'Video: loaded<br>';
                });
                video.addEventListener('error', () => {
                    debug.innerHTML += 'Video: ERROR<br>';
                });
                debug.innerHTML += 'Video ready<br>';
            }
            // Page transition - fade in on load
            setTimeout(() => {
                document.body.classList.remove('page-loading');
                document.body.classList.add('page-loaded');
            }, 100);
        });
    </script>
    <script src="js/aperture-audio.js"></script>
    <script src="js/aperture-transitions.js"></script>
    <script src="js/aperture-scale.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aperture Science Interactive Portfolio</title>
    <link rel="stylesheet" href="css/viewport.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-loading">
    <div id="aperture-viewport">
    <div class="page-transition-overlay"></div>
    <div id="app">
        <section id="view-menu" class="view active" style="opacity: 1;">
            <div id="debug-info" style="position: fixed; top: 10px; left: 10px; color: lime; font-family: monospace; z-index: 1000; background: rgba(0,0,0,0.8); padding: 10px;">Loading...</div>
            <video autoplay loop muted playsinline class="bg-video" poster="assets/education_background.png" id="bg-video">
                <source src="assets/video/menu_background.mp4" type="video/mp4">
            </video>
            
            <!-- Background Music - Menu Soundtrack -->
            <audio id="bg-music" loop autoplay muted>
                <source src="assets/tracks/mainmenu-soundtrack.mp3" type="audio/mpeg">
            </audio>
            
            <nav class="main-menu">
                <ul class="menu-list">
                    <li class="menu-item">
                        <a href="education.html" class="menu-link">
                            <span class="menu-indicator"></span>
                            <span class="menu-label">Wykształcenie</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="projects.html" class="menu-link">
                            <span class="menu-indicator"></span>
                            <span class="menu-label">Projekty</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="social.html" class="menu-link">
                            <span class="menu-indicator"></span>
                            <span class="menu-label">Social Media</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </section>
        
    </div><!-- /#app -->
    </div><!-- /#aperture-viewport -->
    
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Simple menu hover effects only
        document.addEventListener('DOMContentLoaded', () => {
            const menuLinks = document.querySelectorAll('.menu-link');
            
            menuLinks.forEach(link => {
                const indicator = link.querySelector('.menu-indicator');
                const label = link.querySelector('.menu-label');
                
                link.addEventListener('mouseenter', () => {
                    gsap.to(indicator, {
                        opacity: 1,
                        x: 0,
                        duration: 0.15,
                        ease: "power2.out"
                    });
                    
                    gsap.to(label, {
                        color: '#ffffff',
                        duration: 0.15,
                        ease: "power2.out"
                    });
                });
                
                link.addEventListener('mouseleave', () => {
                    gsap.to(indicator, {
                        opacity: 0,
                        x: -10,
                        duration: 0.15,
                        ease: "power2.in"
                    });
                    
                    gsap.to(label, {
                        color: '#a0a0a0',
                        duration: 0.15,
                        ease: "power2.in"
                    });
                });
            });
            
            lucide.createIcons();
            
            const debug = document.getElementById('debug-info');
            const video = document.getElementById('bg-video');
            if (video && debug) {
                video.addEventListener('loadeddata', () => {
                    debug.innerHTML += 'Video: loaded<br>';
                });
                video.addEventListener('error', () => {
                    debug.innerHTML += 'Video: ERROR<br>';
                });
                debug.innerHTML += 'Video ready<br>';
            }
            
            // Background music - 30% volume, unmute on first click
            const bgMusic = document.getElementById('bg-music');
            if (bgMusic) {
                bgMusic.volume = 0.3;
                console.log('Audio found, src:', bgMusic.querySelector('source')?.src);
                
                const unmuteAudio = () => {
                    console.log('Click detected, trying to unmute...');
                    if (bgMusic.muted) {
                        bgMusic.muted = false;
                        bgMusic.play().then(() => {
                            console.log('Audio playing!');
                        }).catch(e => {
                            console.error('Audio play error:', e);
                        });
                    }
                };
                
                document.addEventListener('click', unmuteAudio, { once: true });
            } else {
                console.error('Audio element not found!');
            }
            
            // Page transition - fade in on load
            setTimeout(() => {
                document.body.classList.remove('page-loading');
                document.body.classList.add('page-loaded');
            }, 100);
            
            // Page transition - fade out before leaving
            document.querySelectorAll('a').forEach(link => {
                const href = link.getAttribute('href');
                // Tylko linki wewnętrzne (kończące się na .html, bez http)
                if (!href || href.startsWith('http') || href.startsWith('#') || !href.includes('.html')) {
                    return;
                }
                
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const overlay = document.querySelector('.page-transition-overlay');
                    overlay.classList.add('fade-out');
                    
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                });
            });
        });
    </script>
    <script src="js/aperture-transitions.js"></script>
    <script src="js/aperture-scale.js"></script>
</body>
</html>

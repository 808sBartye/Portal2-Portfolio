<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aperture Science Interactive Portfolio</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="app">
        <section id="view-menu" class="view active" style="opacity: 1;">
            <div id="debug-info" style="position: fixed; top: 10px; left: 10px; color: lime; font-family: monospace; z-index: 1000; background: rgba(0,0,0,0.8); padding: 10px;">Loading...</div>
            <video autoplay loop muted playsinline class="bg-video" poster="assets/education_background.png" id="bg-video">
                <source src="assets/video/menu_background.mp4" type="video/mp4">
            </video>
            
            <nav class="main-menu">
                <ul class="menu-list">
                    <li class="menu-item" data-view="education">
                        <span class="menu-indicator"></span>
                        <span class="menu-label">Wykształcenie</span>
                    </li>
                    <li class="menu-item" data-view="projects">
                        <span class="menu-indicator"></span>
                        <span class="menu-label">Projekty</span>
                    </li>
                    <li class="menu-item" data-view="social">
                        <span class="menu-indicator"></span>
                        <span class="menu-label">Social Media</span>
                    </li>
                </ul>
            </nav>
        </section>
        
        <section id="view-education" class="view">
            <div class="edu-scene-wrapper">
                <div class="edu-bg-layer">
                    <img src="assets/education_background.png" alt="Chamber Background" class="edu-bg-img">
                </div>
                <div class="edu-screen-wrapper">
                <div class="edu-screen-glow"></div>
                <div class="edu-screen-layer">
                    <img src="assets/screen.png" alt="UI Panel" class="edu-screen-img">
                    <div class="edu-grid">
                        <div class="grid-item" data-index="0"></div>
                        <div class="grid-item" data-index="1"></div>
                        <div class="grid-item" data-index="2"></div>
                        <div class="grid-item" data-index="3"></div>
                        <div class="grid-item" data-index="4"></div>
                        <div class="grid-item" data-index="5"></div>
                    </div>
                    <div id="edu-detail-view" style="display: none;">
                        <div class="detail-icon"></div>
                        <h2 class="detail-title">TITLE_PLACEHOLDER</h2>
                        <p id="typewriter-text"></p>
                        <button id="btn-return">COFNIJ -></button>
                    </div>
                </div>
            </div>
            </div>
        </section>
        <section id="view-projects" class="view"></section>
        <section id="view-social" class="view"></section>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // ViewsManager Class
        class ViewsManager {
            constructor() {
                this.currentView = 'menu';
                this.views = {
                    menu: document.getElementById('view-menu'),
                    education: document.getElementById('view-education'),
                    projects: document.getElementById('view-projects'),
                    social: document.getElementById('view-social')
                };
                this.isTransitioning = false;
            }

            transitionTo(viewName) {
                if (this.isTransitioning || viewName === this.currentView) return;
                
                this.isTransitioning = true;
                const currentViewEl = this.views[this.currentView];
                const targetViewEl = this.views[viewName];
                
                if (!targetViewEl) {
                    console.warn(`View "${viewName}" not found`);
                    this.isTransitioning = false;
                    return;
                }

                gsap.to(currentViewEl, {
                    opacity: 0,
                    duration: 0.5,
                    ease: "power2.inOut",
                    onComplete: () => {
                        currentViewEl.classList.remove('active');
                        currentViewEl.style.display = 'none';
                        
                        targetViewEl.style.display = 'block';
                        targetViewEl.classList.add('active');
                        
                        gsap.fromTo(targetViewEl, 
                            { opacity: 0 },
                            { opacity: 1, duration: 0.5, ease: "power2.out", onComplete: () => {
                                this.currentView = viewName;
                                this.isTransitioning = false;
                            }}
                        );
                    }
                });
            }
        }

        // Main App
        const viewsManager = new ViewsManager();

        function initMenu() {
            const menuItems = document.querySelectorAll('.menu-item');
            
            menuItems.forEach(item => {
                const indicator = item.querySelector('.menu-indicator');
                const label = item.querySelector('.menu-label');
                const targetView = item.dataset.view;
                
                item.addEventListener('mouseenter', () => {
                    gsap.to(indicator, {
                        opacity: 1,
                        x: 0,
                        duration: 0.15,
                        ease: "power2.out"
                    });
                    
                    gsap.to(label, {
                        color: '#ffffff',
                        duration: 0.15,
                        ease: "power2.out"
                    });
                });
                
                item.addEventListener('mouseleave', () => {
                    gsap.to(indicator, {
                        opacity: 0,
                        x: -10,
                        duration: 0.15,
                        ease: "power2.in"
                    });
                    
                    gsap.to(label, {
                        color: '#a0a0a0',
                        duration: 0.15,
                        ease: "power2.in"
                    });
                });
                
                item.addEventListener('click', () => {
                    viewsManager.transitionTo(targetView);
                });
            });
        }

        class ParallaxManager {
            constructor() {
                this.bgLayer = document.querySelector('.edu-bg-layer');
                this.screenLayer = document.querySelector('.edu-screen-layer');
                this.isFrozen = false;
                this.mouseX = 0;
                this.mouseY = 0;
                this.targetX = 0;
                this.targetY = 0;
                
                if (this.bgLayer && this.screenLayer) {
                    this.init();
                }
            }
            
            init() {
                window.addEventListener('mousemove', (e) => this.handleMouseMove(e));
            }
            
            handleMouseMove(e) {
                if (this.isFrozen) return;
                
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                this.mouseX = (e.clientX - centerX) / centerX;
                this.mouseY = (e.clientY - centerY) / centerY;
                
                this.animate();
            }
            
            animate() {
                const bgMultiplier = 100;
                const screenMultiplier = 100;
                
                const targetBgX = -this.mouseX * bgMultiplier;
                const targetBgY = -this.mouseY * bgMultiplier;
                const targetScreenX = -this.mouseX * screenMultiplier;
                const targetScreenY = -this.mouseY * screenMultiplier;
                
                gsap.to(this.bgLayer, {
                    x: targetBgX,
                    y: targetBgY,
                    duration: 0.8,
                    ease: "power2.out",
                    overwrite: true
                });
                
                gsap.to(this.screenLayer, {
                    x: targetScreenX,
                    y: targetScreenY,
                    duration: 0.6,
                    ease: "power2.out",
                    overwrite: true
                });
            }
            
            freeze() {
                console.log('FREEZE called, isFrozen was:', this.isFrozen);
                this.isFrozen = true;
                gsap.killTweensOf([this.bgLayer, this.screenLayer]);
                gsap.set([this.bgLayer, this.screenLayer], { x: 0, y: 0 });
                console.log('FREEZE done, isFrozen now:', this.isFrozen);
            }
            
            isFrozenState() {
                return this.isFrozen;
            }
            
            unfreeze() {
                this.isFrozen = false;
            }
        }

        class EducationFocusManager {
            constructor() {
                this.grid = document.querySelector('.edu-grid');
                this.detailView = document.getElementById('edu-detail-view');
                this.sceneWrapper = document.querySelector('.edu-scene-wrapper');
                this.typewriterText = document.getElementById('typewriter-text');
                this.detailTitle = document.querySelector('.detail-title');
                this.returnBtn = document.getElementById('btn-return');
                this.parallaxManager = null;
                this.typewriterInterval = null;
                this.isFocused = false;
                
                this.educationData = {
                    0: {
                        title: "Fizyka Kwantowa",
                        text: "Badania nad zachowaniem cząstek elementarnych w skali subatomowej. Implementacja symulacji mechaniki kwantowej przy użyciu Python i Qiskit."
                    },
                    1: {
                        title: "Algorytmy AI",
                        text: "Projektowanie sieci neuronowych i modeli uczenia maszynowego. Specjalizacja w deep learning i computer vision."
                    },
                    2: {
                        title: "Cyberbezpieczeństwo",
                        text: "Analiza podatności systemów informatycznych. Ethical hacking i penetration testing w środowiskach korporacyjnych."
                    },
                    3: {
                        title: "Grafika 3D",
                        text: "Modelowanie i renderowanie scen trójwymiarowych. Doświadczenie w Blenderze, Three.js i shaderach GLSL."
                    },
                    4: {
                        title: "Systemy Rozproszone",
                        text: "Architektura mikrousług i cloud computing. Kubernetes, Docker, AWS i GCP w praktyce produkcyjnej."
                    },
                    5: {
                        title: "UI/UX Design",
                        text: "Projektowanie interfejsów użytkownika z naciskiem na dostępność i doświadczenie użytkownika. Figma, Adobe XD."
                    }
                };
                
                if (this.grid && this.detailView) {
                    this.init();
                }
            }
            
            init() {
                this.gridItems = this.grid.querySelectorAll('.grid-item');
                this.gridItems.forEach(item => {
                    item.addEventListener('click', (e) => this.enterFocus(e.target));
                });
                
                this.returnBtn.addEventListener('click', () => this.exitFocus());
            }
            
            setParallaxManager(manager) {
                this.parallaxManager = manager;
            }
            
            enterFocus(item) {
                if (this.isFocused) return;
                this.isFocused = true;
                
                const index = item.dataset.index;
                const data = this.educationData[index];
                if (!data) return;
                
                if (this.parallaxManager) {
                    this.parallaxManager.freeze();
                }
                
                this.detailTitle.textContent = data.title;
                this.typewriterText.textContent = '';
                
                const screenWrapper = document.querySelector('.edu-screen-wrapper');
                const screenRect = screenWrapper.getBoundingClientRect();
                const viewportCenterX = window.innerWidth / 2;
                const viewportCenterY = window.innerHeight / 2;
                const screenCenterX = screenRect.left + screenRect.width / 2;
                const screenCenterY = screenRect.top + screenRect.height / 2;
                
                const offsetX = (viewportCenterX - screenCenterX) * 1.5;
                const offsetY = (viewportCenterY - screenCenterY) * 1.5;
                
                const tl = gsap.timeline();
                
                tl.to(this.sceneWrapper, {
                    scale: 1.5,
                    x: offsetX,
                    y: offsetY,
                    duration: 1.0,
                    ease: "power2.inOut"
                })
                .to(this.grid, {
                    opacity: 0,
                    duration: 0.3,
                    ease: "power2.out",
                    onComplete: () => {
                        this.grid.style.display = 'none';
                        this.detailView.style.display = 'flex';
                    }
                }, "-=0.2")
                .to(this.detailView, {
                    opacity: 1,
                    duration: 0.4,
                    ease: "power2.out",
                    onComplete: () => {
                        this.startTypewriter(data.text);
                    }
                });
            }
            
            startTypewriter(text) {
                if (this.typewriterInterval) {
                    clearInterval(this.typewriterInterval);
                }
                
                let index = 0;
                this.typewriterText.textContent = '';
                
                this.typewriterInterval = setInterval(() => {
                    if (index < text.length) {
                        this.typewriterText.textContent += text[index];
                        index++;
                    } else {
                        clearInterval(this.typewriterInterval);
                        this.typewriterInterval = null;
                    }
                }, 15);
            }
            
            exitFocus() {
                if (!this.isFocused) return;
                
                if (this.typewriterInterval) {
                    clearInterval(this.typewriterInterval);
                    this.typewriterInterval = null;
                }
                
                const tl = gsap.timeline({
                    onComplete: () => {
                        this.isFocused = false;
                        console.log('EXIT FOCUS - calling unfreeze');
                        if (this.parallaxManager) {
                            this.parallaxManager.unfreeze();
                        }
                    }
                });
                
                tl.to(this.detailView, {
                    opacity: 0,
                    duration: 0.3,
                    ease: "power2.in",
                    onComplete: () => {
                        this.detailView.style.display = 'none';
                        this.grid.style.display = 'grid';
                    }
                })
                .to(this.grid, {
                    opacity: 1,
                    duration: 0.4,
                    ease: "power2.out"
                }, "+=0.1")
                .to(this.sceneWrapper, {
                    scale: 1,
                    x: 0,
                    y: 0,
                    duration: 1.0,
                    ease: "power2.inOut"
                }, "-=0.4");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const debug = document.getElementById('debug-info');
            
            const gsapLoaded = typeof gsap !== 'undefined';
            if (debug) debug.innerHTML = `GSAP: ${gsapLoaded ? 'OK' : 'FAIL'}<br>`;
            
            if (!gsapLoaded) {
                console.error('GSAP not loaded - check internet connection');
                if (debug) debug.innerHTML += 'ERROR: No internet for GSAP CDN';
                return;
            }
            
            initMenu();
            
            const parallaxManager = new ParallaxManager();
            const focusManager = new EducationFocusManager();
            focusManager.setParallaxManager(parallaxManager);
            
            const video = document.getElementById('bg-video');
            if (video) {
                video.addEventListener('loadeddata', () => {
                    console.log('Video loaded');
                    if (debug) debug.innerHTML += 'Video: loaded<br>';
                });
                video.addEventListener('error', (e) => {
                    console.error('Video error:', e);
                    if (debug) debug.innerHTML += 'Video: ERROR (use server)<br>';
                });
                video.addEventListener('playing', () => {
                    console.log('Video playing');
                    if (debug) debug.innerHTML += 'Video: playing<br>';
                });
                if (debug) debug.innerHTML += `Video ready<br>`;
            }
        });
    </script>
</body>
</html>

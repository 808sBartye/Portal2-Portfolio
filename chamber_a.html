<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overgrown Chamber - Aperture Science</title>
    <link rel="stylesheet" href="css/viewport.css">
    <link rel="stylesheet" href="css/chamber.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body class="chamber-postapo">
    <div id="aperture-viewport">
        <!-- Noise overlay -->
        <div class="noise-overlay"></div>

        <!-- Vignette -->
        <div class="vignette"></div>

        <!-- Return button - always fixed -->
        <!-- Return button - always fixed -->
        <button class="return-btn" onclick="returnToNexus()" data-i18n="return_nexus">
            <span>&larr;</span> POWRÓT DO NEXUSA
        </button>

        <!-- Next Project Button -->
        <button class="next-project-btn" onclick="goToNextProject()" data-i18n="next_project">
            NASTĘPNY PROJEKT <span>&rarr;</span>
        </button>

        <!-- Environment Wrapper with background -->
        <div class="environment-wrapper">
            <!-- Chamber Content Container -->
            <div id="chamber-content">

                <!-- VIEW: Grid Overview -->
                <div id="grid-view" class="view active">
                    <!-- Left Column: 3 horizontal bars -->
                    <div class="left-column">
                        <div class="info-bar" data-section="main-info" onclick="showSection('main-info')">
                            <div class="info-bar-content">
                                <h3>INTERACTIVE PORTFOLIO</h3>
                                <p data-i18n="cham_a_sub_0">Aperture Science UI</p>
                            </div>
                        </div>
                        <div class="info-bar" data-section="about" onclick="showSection('about')">
                            <div class="info-bar-content">
                                <h3>SPORTRECRUT</h3>
                                <p data-i18n="cham_a_sub_1">Aplikacja mobilna</p>
                            </div>
                        </div>
                        <div class="info-bar" data-section="description" onclick="showSection('description')">
                            <div class="info-bar-content">
                                <h3>GITHUB</h3>
                                <p>@808sBartye</p>
                            </div>
                            <i class="fab fa-github info-bar-icon"></i>
                        </div>
                    </div>

                    <!-- Right Grid: 2x3 with icons -->
                    <div class="right-grid">
                        <div class="grid-tile" data-section="tech-stack" onclick="showSection('tech-stack')">
                            <i class="fas fa-layer-group"></i>
                            <h4>CORE STACK</h4>
                            <span data-i18n="cham_a_tile_0">Frontend & 3D</span>
                        </div>
                        <div class="grid-tile" data-section="challenges" onclick="showSection('challenges')">
                            <i class="fas fa-terminal"></i>
                            <h4 data-i18n="cham_a_tile_1_t">KOD ŹRÓDŁOWY</h4>
                            <span data-i18n="cham_a_tile_1">Zobacz jak to działa</span>
                        </div>
                        <div class="grid-tile" data-section="features" onclick="showSection('features')">
                            <i class="fas fa-cloud"></i>
                            <h4>MOBILE & CLOUD</h4>
                            <span data-i18n="cham_a_tile_2">Backend Architecture</span>
                        </div>
                        <div class="grid-tile" data-section="demo" onclick="showSection('demo')">
                            <i class="fas fa-code-branch"></i>
                            <h4 data-i18n="cham_a_tile_3_t">REPOZYTORIUM</h4>
                            <span data-i18n="cham_a_tile_3">Baza kodu aplikacji</span>
                        </div>
                        <div class="grid-tile" data-section="github" onclick="showSection('github')">
                            <i class="fas fa-address-card"></i>
                            <h4 data-i18n="cham_a_tile_4_t">KONTAKT</h4>
                            <span data-i18n="cham_a_tile_4">Mail & Telefon</span>
                        </div>
                        <div class="grid-tile contact-tile" data-section="contact" onclick="showSection('contact')">
                            <i class="fas fa-map-marker-alt"></i>
                            <h4 data-i18n="cham_a_tile_5_t">DOSTĘPNOŚĆ</h4>
                            <span data-i18n="cham_a_tile_5">Otwarty na współpracę</span>
                        </div>
                    </div>
                </div>

                <!-- VIEW: Section Detail (hidden by default) -->
                <div id="section-view" class="view">
                    <button class="back-btn" onclick="showGrid()" data-i18n="edu_return">
                        <i class="fas fa-arrow-left"></i> COFNIJ -&gt;
                    </button>
                    <div class="section-content" id="section-content">
                        <!-- Content loaded dynamically -->
                    </div>
                </div>

            </div>
        </div>

        <!-- Page Transition Overlay -->
        <div class="page-transition-overlay"></div>

                en: {

                        content: '<p>The project you are currently viewing. A fully responsive web portfolio designed from scratch in the aesthetics of Portal 2 laboratory terminals.</p><p>This site serves as my direct testing environment. I implemented custom animations, state management, and 3D object integration, focusing on code optimization and a seamless user experience.</p>'

                    'tech-stack': {
                        title: 'CORE STACK',
                        content: '<p>Application architecture based on clean and efficient code:</p><ul><li><i class="fab fa-react"></i> React & TypeScript &ndash; logic and UI</li><li><i class="fab fa-css3-alt"></i> Advanced CSS &ndash; custom animations and responsiveness</li><li><i class="fas fa-cube"></i> Three.js &ndash; spatial 3D object rendering</li></ul>'

                    'challenges': {

                    'features': {

                    'demo': {
                        title: 'REPOSITORY',
                        githubUrl: 'https://github.com/ekipa-pieronskich-legend/CN2026-SportRecrut',

                    'github': {
                        title: 'CONTACT CHANNELS',
                        content: '<p>Feel free to reach out directly for business, mentoring, or recruitment inquiries:</p><ul><li><i class="fas fa-envelope"></i> <strong>E-mail:</strong> bmajocha@outlook.com</li><li><i class="fas fa-phone"></i> <strong>Phone:</strong> +48 668 170 858</li></ul>'

                    'contact': {
                        title: 'OPERATIONAL STATUS',
                        content: '<p><strong>Current Location:</strong> Nowy Sącz, Poland</p><p>Fully ready to undertake a Junior Developer role or an instructive internship. Actively considering remote work, hybrid models, and <strong>full relocation</strong> (logistically prepared to relocate to Warsaw immediately).</p>'
                    }
                }
            };

            let currentOpenSectionId = null;

            window.addEventListener('apertureLangChanged', function(e) {
                const newLang = e.detail;
                if (currentOpenSectionId && sectionData[newLang] && sectionData[newLang][currentOpenSectionId]) {
                    const data = sectionData[newLang][currentOpenSectionId];
                    const sectionContent = document.getElementById('section-content');
                    if (sectionContent) {
                        sectionContent.innerHTML = `<h2>${data.title}</h2>${data.content}`;
                    }
                }
            });

            // Show section with GSAP animation (like education)
            function showSection(sectionId) {
                const gridView = document.getElementById('grid-view');
                const sectionView = document.getElementById('section-view');
                const sectionContent = document.getElementById('section-content');

                const lang = (window.apertureI18n && window.apertureI18n.lang) || localStorage.getItem('aperture_lang') || 'pl';
                const dataGroup = sectionData[lang] || sectionData.pl;
                const data = dataGroup[sectionId];
                if (!data) return;

                currentOpenSectionId = sectionId;

                sectionContent.innerHTML = `<h2>${data.title}</h2>${data.content}`;

                if (data.githubUrl) {
                    window.open(data.githubUrl, '_blank');
                }

                // GSAP transition
                const tl = gsap.timeline();

                tl.to(gridView, {
                    opacity: 0,
                    scale: 0.95,
                    duration: 0.3,
                    ease: "power2.in",
                    onComplete: () => {
                        gridView.classList.remove('active');
                        sectionView.classList.add('active');
                    }
                })
                    .fromTo(sectionView,
                        { opacity: 0, x: 50 },
                        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }
                    )
                    .fromTo('.section-content > *',
                        { opacity: 0, y: 20 },
                        { opacity: 1, y: 0, duration: 0.3, stagger: 0.1 }
                    );
            }

            // Show grid with GSAP animation
            function showGrid() {
                const gridView = document.getElementById('grid-view');
                const sectionView = document.getElementById('section-view');

                const tl = gsap.timeline();

                tl.to(sectionView, {
                    opacity: 0,
                    x: -50,
                    duration: 0.3,
                    ease: "power2.in",
                    onComplete: () => {
                        sectionView.classList.remove('active');
                        gridView.classList.add('active');
                    }
                })
                    .fromTo(gridView,
                        { opacity: 0, scale: 0.95 },
                        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }
                    );
            }

            // Return to Nexus
            function returnToNexus() {
                if (typeof transitionTo === 'function') {
                    transitionTo('projects.html');
                } else {
                    window.location.href = 'projects.html';
                }
            }

            // Next project button (cycles A -> B -> A)
            function goToNextProject() {
                if (typeof transitionTo === 'function') {
                    transitionTo('chamber_b.html');
                } else {
                    window.location.href = 'chamber_b.html';
                }
            }
        </script>
        <script src="js/aperture-i18n.js"></script>
        <script src="js/aperture-audio.js"></script>
        <script src="js/aperture-transitions.js"></script>
        <script src="js/aperture-scale.js"></script>
    </div><!-- /#aperture-viewport -->
</body>

</html>

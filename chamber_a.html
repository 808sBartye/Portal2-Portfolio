<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overgrown Chamber - Aperture Science</title>
    <link rel="stylesheet" href="css/viewport.css">
    <link rel="stylesheet" href="css/chamber.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body class="chamber-postapo">
    <div id="aperture-viewport">
        <!-- Noise overlay -->
        <div class="noise-overlay"></div>

        <!-- Vignette -->
        <div class="vignette"></div>

        <!-- Return button - always fixed -->
        <button class="return-btn" onclick="returnToNexus()">
            <span>&larr;</span> POWRÓT DO NEXUSA
        </button>

        <!-- Next Project Button -->
        <button class="next-project-btn" onclick="goToNextProject()">
            NASTĘPNY PROJEKT <span>&rarr;</span>
        </button>

        <!-- Environment Wrapper with background -->
        <div class="environment-wrapper">
            <!-- Chamber Content Container -->
            <div id="chamber-content">

                <!-- VIEW: Grid Overview -->
                <div id="grid-view" class="view active">
                    <!-- Left Column: 3 horizontal bars -->
                    <div class="left-column">
                        <div class="info-bar" data-section="main-info" onclick="showSection('main-info')">
                            <div class="info-bar-content">
                                <h3>INTERACTIVE PORTFOLIO</h3>
                                <p>Aperture Science UI</p>
                            </div>
                        </div>
                        <div class="info-bar" data-section="about" onclick="showSection('about')">
                            <div class="info-bar-content">
                                <h3>SPORTRECRUT</h3>
                                <p>Aplikacja mobilna</p>
                            </div>
                        </div>
                        <div class="info-bar" data-section="description" onclick="showSection('description')">
                            <div class="info-bar-content">
                                <h3>GITHUB</h3>
                                <p>@808sBartye</p>
                            </div>
                            <i class="fab fa-github info-bar-icon"></i>
                        </div>
                    </div>

                    <!-- Right Grid: 2x3 with icons -->
                    <div class="right-grid">
                        <div class="grid-tile" data-section="tech-stack" onclick="showSection('tech-stack')">
                            <i class="fas fa-layer-group"></i>
                            <h4>CORE STACK</h4>
                            <span>Frontend & 3D</span>
                        </div>
                        <div class="grid-tile" data-section="challenges" onclick="showSection('challenges')">
                            <i class="fas fa-terminal"></i>
                            <h4>KOD ŹRÓDŁOWY</h4>
                            <span>Zobacz jak to działa</span>
                        </div>
                        <div class="grid-tile" data-section="features" onclick="showSection('features')">
                            <i class="fas fa-cloud"></i>
                            <h4>MOBILE & CLOUD</h4>
                            <span>Backend Architecture</span>
                        </div>
                        <div class="grid-tile" data-section="demo" onclick="showSection('demo')">
                            <i class="fas fa-code-branch"></i>
                            <h4>REPOZYTORIUM</h4>
                            <span>Baza kodu aplikacji</span>
                        </div>
                        <div class="grid-tile" data-section="github" onclick="showSection('github')">
                            <i class="fas fa-address-card"></i>
                            <h4>KONTAKT</h4>
                            <span>Mail & Telefon</span>
                        </div>
                        <div class="grid-tile contact-tile" data-section="contact" onclick="showSection('contact')">
                            <i class="fas fa-map-marker-alt"></i>
                            <h4>DOSTĘPNOŚĆ</h4>
                            <span>Otwarty na współpracę</span>
                        </div>
                    </div>
                </div>

                <!-- VIEW: Section Detail (hidden by default) -->
                <div id="section-view" class="view">
                    <button class="back-btn" onclick="showGrid()">
                        <i class="fas fa-arrow-left"></i> WRÓĆ
                    </button>
                    <div class="section-content" id="section-content">
                        <!-- Content loaded dynamically -->
                    </div>
                </div>

            </div>
        </div>

        <!-- Page Transition Overlay -->
        <div class="page-transition-overlay"></div>

        <script>
            // Section content data
            const sectionData = {
                'main-info': {
                    title: 'O PROJEKCIE',
                    content: '<p>Projekt, w którym się obecnie znajdujesz. W pełni responsywne portfolio webowe zaprojektowane od zera w estetyce terminali laboratoryjnych z Portala 2. Strona stanowi moje bezpośrednie środowisko testowe. Zaimplementowałem tu customowe animacje, zarządzanie stanem oraz integrację obiektów 3D, dbając o pełną optymalizację kodu i płynność interfejsu.</p>'
                },
                'about': {
                    title: 'O PROJEKCIE',
                    content: '<p>Zaawansowana platforma mobilna (iOS/Android) rozwiązująca problem rekrutacji do amatorskich drużyn sportowych.</p><p>Jako główny twórca zaimplementowałem systemy grywalizacji oparte na utrzymywaniu aktywności (streaki), moduły analityczne oraz zaawansowane heatmapy odwzorowujące aktywność użytkowników na mapie.</p><p><strong>🏆 Projekt zajął 3. miejsce na lokalnym hackathonie.</strong></p>'
                },
                'description': {
                    title: 'PROFIL GITHUB',
                    githubUrl: 'https://github.com/808sBartye',
                    content: '<p>Przekierowanie do głównego profilu. Zobacz historię commitów, workflow i pozostałe mniejsze projekty.</p><p><a href="https://github.com/808sBartye" target="_blank" class="action-btn"><i class="fab fa-github"></i> Przejdź do profilu @808sBartye</a></p>'
                },
                'tech-stack': {
                    title: 'CORE STACK',
                    content: '<p>Architektura aplikacji oparta na czystym i wydajnym kodzie:</p><ul><li><i class="fab fa-react"></i> React & TypeScript &ndash; logika i UI</li><li><i class="fab fa-css3-alt"></i> Zaawansowany CSS &ndash; customowe animacje i responsywność</li><li><i class="fas fa-cube"></i> Three.js &ndash; renderowanie obiektów przestrzennych 3D</li></ul>'
                },
                'challenges': {
                    title: 'KOD ŹRÓDŁOWY',
                    githubUrl: 'https://github.com/808sBartye/Poral2-Portfolio',
                    content: '<p>Przekierowanie do repozytorium. Zobacz architekturę całego interfejsu w kodzie źródłowym.</p><p><a href="https://github.com/808sBartye/Poral2-Portfolio" target="_blank" class="action-btn"><i class="fab fa-github"></i> Kod źródłowy portfolio</a></p>'
                },
                'features': {
                    title: 'MOBILE & CLOUD',
                    content: '<p>Projekt zbudowany w środowisku cross-platformowym z chmurowym backendem:</p><ul><li><i class="fab fa-react"></i> React Native &ndash; aplikacja mobilna (iOS/Android)</li><li><i class="fas fa-database"></i> Supabase & PostgreSQL &ndash; relacyjna baza danych i logika</li><li><i class="fas fa-fire"></i> Firebase &ndash; autoryzacja i system powiadomień</li></ul>'
                },
                'demo': {
                    title: 'REPOZYTORIUM',
                    githubUrl: 'https://github.com/ekipa-pieronskich-legend/CN2026-SportRecrut',
                    content: '<p>Przekierowanie do repozytorium. Sprawdź czystość kodu i strukturę bazy danych aplikacji SportRecrut.</p><p><a href="https://github.com/ekipa-pieronskich-legend/CN2026-SportRecrut" target="_blank" class="action-btn"><i class="fab fa-github"></i> Repozytorium SportRecrut</a></p>'
                },
                'github': {
                    title: 'KONTAKT',
                    content: '<p>Zapraszam do bezpośredniego kontaktu biznesowego i rekrutacyjnego:</p><ul><li><i class="fas fa-envelope"></i> <strong>E-mail:</strong> bmajocha@outlook.com</li><li><i class="fas fa-phone"></i> <strong>Telefon:</strong> +48 668 170 858</li></ul>'
                },
                'contact': {
                    title: 'DOSTĘPNOŚĆ',
                    content: '<p><strong>Aktualna lokalizacja:</strong> Nowy Sącz (i okolice)</p><p>Jestem w pełni gotowy do podjęcia pracy jako Junior Developer lub stażysta. Aktywnie rozważam pracę w modelu zdalnym, hybrydowym oraz <strong>pełną relokację</strong>.</p>'
                }
            };

            // Show section with GSAP animation (like education)
            function showSection(sectionId) {
                const gridView = document.getElementById('grid-view');
                const sectionView = document.getElementById('section-view');
                const sectionContent = document.getElementById('section-content');

                const data = sectionData[sectionId];
                if (!data) return;

                sectionContent.innerHTML = `<h2>${data.title}</h2>${data.content}`;

                if (data.githubUrl) {
                    window.open(data.githubUrl, '_blank');
                }

                // GSAP transition
                const tl = gsap.timeline();

                tl.to(gridView, {
                    opacity: 0,
                    scale: 0.95,
                    duration: 0.3,
                    ease: "power2.in",
                    onComplete: () => {
                        gridView.classList.remove('active');
                        sectionView.classList.add('active');
                    }
                })
                    .fromTo(sectionView,
                        { opacity: 0, x: 50 },
                        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }
                    )
                    .fromTo('.section-content > *',
                        { opacity: 0, y: 20 },
                        { opacity: 1, y: 0, duration: 0.3, stagger: 0.1 }
                    );
            }

            // Show grid with GSAP animation
            function showGrid() {
                const gridView = document.getElementById('grid-view');
                const sectionView = document.getElementById('section-view');

                const tl = gsap.timeline();

                tl.to(sectionView, {
                    opacity: 0,
                    x: -50,
                    duration: 0.3,
                    ease: "power2.in",
                    onComplete: () => {
                        sectionView.classList.remove('active');
                        gridView.classList.add('active');
                    }
                })
                    .fromTo(gridView,
                        { opacity: 0, scale: 0.95 },
                        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }
                    );
            }

            // Return to Nexus
            function returnToNexus() {
                if (typeof transitionTo === 'function') {
                    transitionTo('projects.html');
                } else {
                    window.location.href = 'projects.html';
                }
            }

            // Next project button (cycles A -> B -> A)
            function goToNextProject() {
                if (typeof transitionTo === 'function') {
                    transitionTo('chamber_b.html');
                } else {
                    window.location.href = 'chamber_b.html';
                }
            }
        </script>
        <script src="js/aperture-audio.js"></script>
        <script src="js/aperture-transitions.js"></script>
        <script src="js/aperture-scale.js"></script>
    </div><!-- /#aperture-viewport -->
</body>

</html>
